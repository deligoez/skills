  expected_not_contains: [seviyene]

- id: kume-biz-tekduzeligi
  source: turkish-native/p49-we-verb-monotony
  ref: references/registers.md
  kind: fix
  context: Aynı sayfadan üç başlık. Her biri tek başına doğru; küme olarak değerlendir.
  input: "Masajdan cilt bakımına kadar hepsini yaparız.\nSeans sonrası devam önerisi veririz.\nSeansı üç adımda tamamlarız."
  expected_contains: [masaj, cilt bakımı, devam önerisi, üç adım]
  expected_property: Üç başlık aynı yüklem sonuyla bitmez; hiçbir bilgi düşmez.

- id: kume-edilgen-tekduzeligi
  source: turkish-native/p49-passive-monotony
  ref: references/registers.md
  kind: fix
  context: Aynı sayfadan üç başlık.
  input: "Arıza cihazla tespit edilir.\nÜcret işlem öncesi bildirilir.\nİş üç adımda tamamlanır."
  expected_contains: [cihaz, ücret, üç adım]
  expected_property: >-
    Üç başlığın üçü birden edilgen kalmaz (bir ya da ikisinin edilgen kalması serbest); işletme en az
    bir başlıkta görünür; bilgi düşmez.

- id: kume-tek-biz-ses
  source: turkish-native/p49-single-we-control
  ref: references/registers.md
  kind: control
  context: Sayfadaki tek birinci çoğul başlık; bu bir ses, tik değil.
  input: Sütü köyden alırız.
  expected: Sütü köyden alırız.

- id: iki-yuvada-ayni-cumle
  source: turkish-native/p50-reordered-duplicate
  ref: references/registers.md
  kind: fix
  mode: review
  context: Bir bölüm başlığı ve altındaki bant. Sayfada başka olgu verilmemiş.
  input: "Sofranız katkısız, üreticimiz belgeli.\nÜreticimiz belgeli, ürünümüz katkısız."
  expected_contains: [öneri]
  expected_property: >-
    İki yuvanın aynı şeyi söylediğini bildirir ve ikinci yuva için yazardan bilgi ister; yeni bir
    olgu uydurmaz.

- id: iki-yuva-farkli-olgu
  source: turkish-native/p50-similar-but-different-control
  ref: references/registers.md
  kind: control
  context: Benzer görünen ama farklı olgu söyleyen iki bant.
  input: "Ekmeği her gün taze pişiririz.\nPastayı siparişe göre yaparız."
  expected: "Ekmeği her gün taze pişiririz.\nPastayı siparişe göre yaparız."

- id: menuyu-tekrarlayan-etiket
  source: turkish-native/p51-nav-echo
  ref: references/registers.md
  kind: fix
  mode: review
  context: >-
    "Bakım menüsü" başlığının üstündeki küçük etiket; sayfanın menüsünde zaten "Hizmetler"
    bağlantısı var.
  input: Hizmetler
  expected_contains: [öneri]
  expected_property: Etiketin menüyü tekrarladığını bildirir; yerine sayfadan çıkmayan bir konu uydurmaz.

- id: yerini-hak-eden-etiket
  source: turkish-native/p51-label-earns-place-control
  ref: references/registers.md
  kind: control
  context: Ana başlığın üstündeki küçük etiket; menüde böyle bir öğe yok.
  input: Kadıköy · Güzellik ve bakım
  expected: Kadıköy · Güzellik ve bakım

