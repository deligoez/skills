# references/registers.md: başlık, slogan, arayüz metni, ürün dili, sayfa düzeyi küme denetimi.
cases:
- id: slogan-nesnesiz
  source: saha
  ref: references/registers.md
  kind: fix
  context: Kitap kapağında tek başına duran slogan; okur devreleri kendisi kuruyor.
  input: Okumazsın, kurarsın.
  expected_not_contains: ["Okumazsın, kurarsın."]
  expected_property: >-
    Slogan bağlamsız okunduğunda anlaşılır; çıplak "kurarsın" kalmaz. Nesne, tümleç ya da eylemi
    okura bağlayan bir öğe (ör. "kendin") gelmesi yeterlidir; nesnenin açıkça yazılması şart değil.

- id: baslik-eksiltisi
  source: saha
  ref: references/registers.md
  kind: fix
  context: Kitap kapağı alt başlığı; kaynak "the name comes last" (okur önce keşfediyor, adı sonra öğreniyor).
  input: Adı en sonda.
  expected_property: Başlık bağlamsız anlaşılır; fiil geri gelir.

